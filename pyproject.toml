[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facedata"
version = "0.1.0"
description = "Synthetic, demographically labelled face dataset for age-estimation research (SDXL -> AgeTransGAN -> CodeFormer) with fairness and realism evaluation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
eval = ["matplotlib>=3.7", "pillow>=10.0"]
generation = ["torch", "diffusers", "transformers", "accelerate", "opencv-python"]
fid = ["tensorflow"]
tools = ["flask", "streamlit"]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]
extend-exclude = ["legacy_as_run", "notebooks_original", "tools"]

[tool.ruff.lint]
ignore = ["EXE002", "ISC004"]
